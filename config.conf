# Usage:
#    bash <(wget -qO- https://raw.githubusercontent.com/fscarmen/sing-box/main/sing-box.sh) -f config.conf

# 语言: C=中文, E=English
# Language: C=Chinese, E=English
LANGUAGE='C'

# 协议选择: a=全部; 可多选如 bcdfk
# Protocols: a=all; multi-select like bcdfk
CHOOSE_PROTOCOLS='a'

# 起始端口 / Start port
START_PORT='8881'

# Nginx 订阅端口；留空按模式询问或默认；n 表示不需要订阅
# Nginx subscription port; n means no subscription
PORT_NGINX=''

# 服务器 IP / Server IP
SERVER_IP=''

# CDN / preferred address
CDN='skk.moe'

# VMess / VLESS WS 域名 / domain
VMESS_HOST_DOMAIN=''
VLESS_HOST_DOMAIN=''

# UUID / password
UUID_CONFIRM=''

# 是否启用订阅 / Enable subscription
SUBSCRIBE='false'

# 是否启用 Argo Tunnel / Enable Argo Tunnel
ARGO='false'
ARGO_DOMAIN=''
ARGO_AUTH=''

# Hysteria2 端口跳跃范围，例如 50000:51000；留空禁用
# Hysteria2 port hopping range, e.g. 50000:51000; empty to disable
HY2_PORT_HOPPING_RANGE=''

# Hysteria2 Realm / WARP 辅助
HY2_REALM='false'
HY2_WARP='false'

# Reality 的私钥, 留空则随机生成
# Reality private key. Random generation if left empty
REALITY_PRIVATE=''

# 节点名称，支持 emoji 表情
# Node name, emoji supported
NODE_NAME_CONFIRM=''

# 指定网络出口，绑定到指定网卡 / Bind network interface to a specific network adapter
# 例如 / e.g. BIND_INTERFACE=eth0
# 留空则不指定 / Leave empty to not specify
BIND_INTERFACE=''

# sing-box-extended 管理端/Admin Panel
# Enable manager/admin panel: true/false
EXT_MANAGER='false'
# 默认 127.0.0.1，避免公网暴露；如需公网访问可设为 0.0.0.0
# Default 127.0.0.1 to avoid public exposure; use 0.0.0.0 if needed
EXT_MANAGER_LISTEN='127.0.0.1'
EXT_MANAGER_API_PORT='8080'
EXT_NODE_API_PORT='7000'
EXT_ADMIN_PORT='8081'
# 留空自动生成；管理端和节点端需保持一致
# Empty to auto-generate; must match between manager and node
EXT_API_KEY=''

# sing-box-extended 节点端
# Enable node mode: true/false
EXT_NODE='false'
# 管理端地址；同机部署可保持 127.0.0.1
# Manager server address; keep 127.0.0.1 for same-host deployment
EXT_NODE_MANAGER_SERVER='127.0.0.1'
# 留空自动生成
# Empty to auto-generate
EXT_NODE_UUID=''
